name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and add our code
        run: |
          flutter --version
          flutter create --org com.vishal --project-name book_snippets --platforms=android app
          rm -rf app/lib app/test/widget_test.dart
          cp -r lib app/lib
          cp -r test/. app/test/
          cp android_overrides/proguard-rules.pro app/android/app/proguard-rules.pro
          cd app
          flutter pub add pdfrx:2.4.7 file_picker path_provider shared_preferences google_mlkit_text_recognition
          sed -i -E 's/minSdk(Version)? ?=? ?flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts
          cat ../android_overrides/skip-lint-vital.gradle.kts >> android/build.gradle.kts

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: book-snippets-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
